name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  wasm-build:
    name: Wasm build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            playground/package-lock.json
            editors/vscode-solcore/package-lock.json

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Install playground dependencies
        working-directory: playground
        run: npm ci

      - name: Test playground language providers
        working-directory: playground
        run: npm run test:unit

      - name: Build release playground
        working-directory: playground
        run: npm run build

      - name: Validate VS Code extension package
        working-directory: editors/vscode-solcore
        run: |
          npm ci
          node --check extension.js
          npm pack --dry-run

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --all-features --locked

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      E2E: "1"
      E2E_REQUIRED: "1"
      ANVIL_HARDFORK: "osaka"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.9.0
        with:
          version: v1.7.1

      - name: Configure solc path
        run: echo "SOLC=$RUNNER_TEMP/solc" >> "$GITHUB_ENV"

      - name: Install solc
        run: |
          curl --fail --location --retry 3 \
            --output "$SOLC" \
            https://github.com/ethereum/solidity/releases/download/v0.8.35/solc-static-linux
          chmod +x "$SOLC"

      - name: Show tool versions
        run: |
          "$SOLC" --version
          anvil --version
          cast --version

      - name: Compile Yul regression corpus with solc
        run: >-
          cargo test --profile e2e -p solcore-yul --test snapshots --locked
          solc_strict_assembly_compiles_snapshots_and_repros_when_present --
          --nocapture

      - name: Run E2E tests
        run: >-
          cargo test --profile e2e -p solcore-yul -p solcore-sonatina
          --test e2e --locked -- --nocapture --test-threads=1

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked
