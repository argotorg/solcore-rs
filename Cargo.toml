[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
salsa = "0.27"
url = "2.5"
annotate-snippets = "0.12"
rustc-hash = "2"
percent-encoding = "2.3"
ena = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parser = { path = "crates/parser", package = "solcore-parser" }
hir = { path = "crates/hir", package = "solcore-hir" }
nameres = { path = "crates/nameres", package = "solcore-nameres" }
hir-ty = { path = "crates/hir-ty", package = "solcore-hir-ty" }
vfs = { path = "crates/vfs", package = "solcore-vfs" }

[workspace.package]
edition = "2024"

# Release profile is size-tuned primarily for the `solcore-wasm` browser bundle
# (`wasm-pack build`). Only affects explicit `--release` builds; dev/test/clippy are unaffected.
[profile.release]
opt-level = "z"   # optimize for size
lto = true        # fat LTO across the dependency tree
codegen-units = 1 # smaller code at the cost of build parallelism
strip = true      # strip symbols + DWARF debug info (the dominant wasm-size win)
