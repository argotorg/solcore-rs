[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
salsa = "0.27"
url = "2.5"
annotate-snippets = "0.12"
rustc-hash = "2"
percent-encoding = "2.3"
ena = "0.14"
matchcov = "0.1.0"
num-bigint = "0.4.6"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
smallvec = "1"
sonatina-codegen = { git = "https://github.com/fe-lang/sonatina", rev = "55ca888" }
sonatina-ir = { git = "https://github.com/fe-lang/sonatina", rev = "55ca888" }
sonatina-triple = { git = "https://github.com/fe-lang/sonatina", rev = "55ca888" }
sonatina-verifier = { git = "https://github.com/fe-lang/sonatina", rev = "55ca888" }
parser = { path = "crates/parser", package = "solcore-parser" }
hir = { path = "crates/hir", package = "solcore-hir" }
nameres = { path = "crates/nameres", package = "solcore-nameres" }
hir-ty = { path = "crates/hir-ty", package = "solcore-hir-ty" }
compiler = { path = "crates/compiler", package = "solcore-compiler" }
vfs = { path = "crates/vfs", package = "solcore-vfs" }

[workspace.package]
edition = "2024"
rust-version = "1.97.0"

# Native release builds favor compiler throughput. Browser bundles use the
# separate `wasm-release` profile below so native and wasm builds do not trade
# off against one another.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

# Keep the browser bundle on the previous size-oriented settings. Playground
# wasm-pack commands select this profile explicitly.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# E2E execution spends most of its time building test binaries and external
# EVM artifacts. Moderate optimization is sufficient and avoids the release
# profile's LTO cost.
[profile.e2e]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
strip = true
