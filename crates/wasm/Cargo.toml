[package]
name = "solcore-wasm"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
solcore-test-directives = { path = "../test-directives" }
hir = { workspace = true }
hir-ty = { workspace = true }
parser = { workspace = true }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
console_error_panic_hook = "0.1"
compiler = { workspace = true }
vfs = { workspace = true }
nameres = { workspace = true }
hull = { path = "../hull", package = "solcore-hull" }
yul = { path = "../yul", package = "solcore-yul" }
sonatina = { path = "../sonatina", package = "solcore-sonatina" }
sonatina-codegen = { workspace = true }
revm = { version = "43.0.2", default-features = false, features = ["std", "sha3-keccak", "memory_limit"] }

# Cryptographic dependencies obtain entropy through the browser Web Crypto API.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# wasm-pack's bundled wasm-opt is too old for reference-types (multiple tables).
# Size is handled by the workspace `[profile.wasm-release]` (strip + opt-level=z + lto);
# for a final size pass run a modern `wasm-opt -Oz --enable-reference-types` (see playground/README).
[package.metadata.wasm-pack.profile.custom]
wasm-opt = false
