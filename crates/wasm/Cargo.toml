[package]
name = "solcore-wasm"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
console_error_panic_hook = "0.1"
vfs = { workspace = true }
hir = { workspace = true }
hir-ty = { workspace = true }
nameres = { workspace = true }
parser = { workspace = true }
hull = { path = "../hull", package = "solcore-hull" }
specialize = { path = "../specialize", package = "solcore-specialize" }
yul = { path = "../yul", package = "solcore-yul" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
