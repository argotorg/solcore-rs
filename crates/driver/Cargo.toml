[package]
name = "solcore-driver"
default-run = "solcore"
version.workspace = true
publish.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
annotate-snippets = { workspace = true }
compiler = { workspace = true }
ethdebug = { path = "../ethdebug", package = "solcore-ethdebug" }
libc = "0.2"
salsa = { workspace = true }
rustc-hash = { workspace = true }
url = { workspace = true }
hir = { workspace = true }
hir-ty = { workspace = true }
hull = { path = "../hull", package = "solcore-hull" }
parser = { workspace = true }
nameres = { workspace = true }
specialize = { path = "../specialize", package = "solcore-specialize" }
sonatina = { path = "../sonatina", package = "solcore-sonatina" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
yul = { path = "../yul", package = "solcore-yul" }
vfs = { workspace = true }
serde_json = "1"
solcore-lsp = { path = "../lsp", features = ["native"] }

[dev-dependencies]
boon = "0.6.1"
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"] }
revm = { version = "43.0.2", default-features = false, features = ["std", "sha3-keccak", "memory_limit"] }
