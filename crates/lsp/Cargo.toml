[package]
name = "solcore-lsp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Core handlers over solcore-vfs are wasm-clean by default (no tokio/stdio).
default = []
# Native stdio LSP server (tower-lsp + tokio) — never in the wasm build.
native = ["dep:tower-lsp", "dep:tokio"]
# WASM Web Worker entry (JSON-RPC over postMessage; no tokio).
wasm = ["dep:wasm-bindgen"]

[dependencies]
vfs = { workspace = true }
hir = { workspace = true }
hir-ty = { workspace = true }
nameres = { workspace = true }
parser = { workspace = true }
# tower-lsp 0.20.0 depends on lsp-types 0.94.1, so pin the
# same exact protocol crate here to avoid duplicate LSP type versions later.
lsp-types = "=0.94.1"
line-index = "=0.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { workspace = true }
percent-encoding = { workspace = true }
tower-lsp = { version = "0.20", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stacker = "0.1"

[[bin]]
name = "solcore-lsp"
path = "src/bin/server.rs"
required-features = ["native"]

# wasm-pack's bundled wasm-opt is too old for the bulk-memory ops rustc now emits.
# Size is handled by the workspace `[profile.wasm-release]` (strip + opt-level=z + lto);
# the playground `build:lsp-wasm` script runs a modern `wasm-opt` pass separately.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = false
