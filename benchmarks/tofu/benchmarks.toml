# The key must match <key>.json generated by materialize.py.
# `evmasm` is the least Solidity-specific solc-bench pipeline selector; both
# adapters ignore the Solidity optimizer/viaIR settings it injects.

["std-free"]
pipelines = ["evmasm"]
tags = ["fast", "frontend"]

["dispatch-small"]
pipelines = ["evmasm"]
tags = ["dispatch"]

["erc20-large"]
pipelines = ["evmasm"]
tags = ["large"]

["multi-file"]
pipelines = ["evmasm"]
tags = ["imports"]
